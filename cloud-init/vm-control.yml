runcmd:
  # add client to known-hosts
  - ssh-keyscan 192.168.0.101 >> /home/service/.ssh/known_hosts
  - chown -R service:service /home/service/.ssh/known_hosts
  # ansible
  # - git clone -b hyperv https://github.com/tiborauer/ansible-win /home/service/deploy
  # - chown -R service:service /home/service/deploy
  # - [ bash, /home/service/deploy/ansible/install.sh, /home/service/deploy/ansible ]
  # - ansible-galaxy role install --roles-path=/etc/ansible/roles idiv_biodiversity.lmod &>> /var/log/custom-init.log || echo '[WARNING] - Ansible role "lmod" is not installed' >> /var/log/custom-init.log
  # prepare for ansible run
  # - keyring to store ansible vault password set up by ./utils/vault-keyring.py
  - pip install keyring keyrings.cryptfile --break-system-packages
  # cloud-init cleanup
  # - remove metadata iso
  - test -b /dev/cdrom && eject
  - test -b /dev/sr0 && eject /dev/sr0
  # - disable cloud init on next boot (https://cloudinit.readthedocs.io/en/latest/topics/boot.html, https://askubuntu.com/a/1047618)
  - touch /etc/cloud/cloud-init.disabled
  - echo '[INFO] - cloud-init finished' >> /var/log/custom-init.log