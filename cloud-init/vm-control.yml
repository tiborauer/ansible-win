#cloud-config
locale: en_GB.utf8
timezone: GMT

growpart:
  mode: auto
  devices: [/]
  ignore_growroot_disabled: false

keyboard:
  layout: gb
 
preserve_sources_list: true
package_update: true
package_upgrade: true
package_reboot_if_required: true
packages:
  - software-properties-common
  - eject
  - keyboard-configuration
  - git
  - python3-pip

users:
  - name: service
    lock_passwd: true
    gecos: Service User
    shell: /bin/bash
    groups: [users,admin,wheel]
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - "ssh-rsa "
ssh_pwauth: false

ansible:
  install_method: pip
  package_name: ansible
  run_user: service
  galaxy:
    actions: ['ansible-galaxy', 'role', 'install', 'idiv_biodiversity.lmod']
  setup_controller:
    repositories:
      - path: /home/service/deploy
        source: https://github.com/tiborauer/ansible-win

